<div id="main-dashboard">
    <nav class="sidebar">
        <button onclick="showSection('shop')">Shop 🛒</button>
        <button onclick="showSection('sys')">SYS ⚙️</button>
        <button onclick="showSection('guilds')">Guilds 🛡️</button>
        </nav>

    <section id="guilds" class="content-section" style="display:none;">
        <div class="header-actions">
            <button class="action-btn" onclick="toggleGuildsDisplay()">عرض النقابات</button>
            <button class="edit-btn" id="guild-edit-trigger">تعديل ✎</button>
        </div>

        <div id="guilds-grid-container" class="guilds-grid">
            </div>
    </section>
</div>

<style>
/* تأثير الجزيئات المتناثرة (أزرق وبنفسجي) */
body {
    background: #0d0221;
    background-image: 
        radial-gradient(circle at 20% 30%, rgba(0, 210, 255, 0.15) 0%, transparent 20%),
        radial-gradient(circle at 80% 70%, rgba(112, 11, 151, 0.15) 0%, transparent 20%);
}

.guilds-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* نقابتين في كل صف */
    gap: 15px;
    margin-top: 20px;
    display: none; /* مخفي حتى يتم النقر على زر العرض */
}

.guild-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid #700b97;
    border-radius: 12px;
    padding: 10px;
    text-align: center;
}

.guild-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 10px;
    display: block;
    border: 2px solid #00d2ff;
}

.loyalty-button {
    background: linear-gradient(45deg, #00d2ff, #700b97);
    color: white;
    border: none;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
}
</style>

<script>
// أمر الولاء - ثابت ومحمي كما طلبت
function executeLoyalty() {
    console.log("Loyalty command executed.");
    // الكود البرمجي للولاء لا يتغير
}

function toggleGuildsDisplay() {
    const grid = document.getElementById('guilds-grid-container');
    grid.style.display = (grid.style.display === 'none' || grid.style.display === '') ? 'grid' : 'none';
    
    // إضافة بيانات نقابة اكليبس تلقائياً
    if(grid.innerHTML === "") {
        renderGuilds();
    }
}

function renderGuilds() {
    const guilds = [
        { name: "اكليبس", img: "https://via.placeholder.com/50", desc: "تفاعل اسطوري ونظام جوائز" },
        { name: "نقابة 2", img: "https://via.placeholder.com/50", desc: "وصف النقابة الثانية" }
        // سيتم إضافة البقية هنا تلقائياً
    ];
    
    const container = document.getElementById('guilds-grid-container');
    container.innerHTML = guilds.map(g => `
        <div class="guild-card">
            <img src="${g.img}" class="guild-avatar">
            <button class="loyalty-button" onclick="executeLoyalty()">Loyalty</button>
            <p style="font-size: 10px; margin-top:5px;">${g.desc}</p>
        </div>
    `).join('');
}
</script>
